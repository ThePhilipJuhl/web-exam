<div id="search_results" class="
p-absolute top-8 left-0 w-full bg-c-white h-50 pa-4
border-1 border-c-gray:+50 rounded-sm">
    {% for user in users: %}
        <div class="d-flex a-items-center">
            <img src="{{ x.get_avatar_url(user.user_avatar_path) }}" class="w-8 h-8 rounded-full" alt="Profile Picture">
            <div class="w-full ml-2">
                <p class="">
                    {{ user.user_first_name }} {{ user.user_last_name }}
                    <span class="text-c-gray:+20 text-70">@{{ user.user_username }}</span>
                </p>
            
            </div>
            {% set user_pk = user.user_pk %}
            {% if user.is_following %}
                {% include "___button_following_user.html" %}
            {% else %}
                {% include "___button_follow_user.html" %}
            {% endif %}
        </div>
    {% endfor %}
</div>
