<h1>
  {{ x.lans("profile") }}
</h1>

<form class="x-dialog__form" action="{{ url_for('api_update_profile') }}" mix-post autocomplete="off">
    <div>
        <label for="user_avatar">
        <span>Profile Picture</span>
        </label>
        <input name="user_avatar" id="user_avatar" type="file" accept="image/jpeg,image/jpg,image/png,image/gif">
        {% if user.user_avatar_path %}
        <div style="margin-top: 10px;">
            <img src="{{ x.get_avatar_url(user.user_avatar_path) }}" alt="Current avatar" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover;">
        </div>
        {% endif %}
    </div>
    <div>
        <label for="user_email">
        <span>{{ x.lans("email") }}</span>
        </label>
        <input name="user_email" id="user_email" type="text" mix-check="{{ x.REGEX_EMAIL }}" value="{{ user.user_email }}">
    </div>
    <div>
        <label for="user_username">
        <span>{{ x.lans("username") }}</span> - {{ x.USER_USERNAME_MIN }} to {{ x.USER_USERNAME_MAX }} characters
        </label>
        <input name="user_username" id="user_username" type="text" mix-check="{{ x.REGEX_USER_USERNAME }}" value="{{ user.user_username }}">
    </div>
    <div>
        <label for="user_first_name">
        <span>{{ x.lans("first_name") }}</span> - {{ x.USER_FIRST_NAME_MIN }} to {{ x.USER_FIRST_NAME_MAX }} characters
        </label>
        <input name="user_first_name" id="user_first_name" type="text" mix-check="{{ x.REGEX_USER_USERNAME }}" value="{{ user.user_first_name }}">
    </div>            
    <button class="x-dialog__btn" 
    mix-default="Update profile" 
    mix-await="Updating profile ...">
        {{ x.lans("update_profile") }}
    </button>
</form>
<div class="x-dialog__delete">
  <p>{{ x.lans("delete_profile_warning") }}</p>
  <button class="x-dialog__btn x-dialog__btn--delete" mix-delete="{{ url_for('delete_profile') }}">
      {{ x.lans("delete_profile") }}
  </button>
</div>
