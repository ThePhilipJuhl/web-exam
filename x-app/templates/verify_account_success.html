{% include "_header.html" %}

<main class="x-landing">
  <div class="x-landing__left">
      <div class="x-landing__logo" aria-hidden="true">
        <svg width="300" height="300.251" version="1.1" xmlns="http://www.w3.org/2000/svg">
        <path d="M178.57 127.15 290.27 0h-26.46l-97.03 110.38L89.34 0H0l117.13 166.93L0 300.25h26.46l102.4-116.59 81.8 116.59h89.34M36.01 19.54H76.66l187.13 262.13h-40.66"/>
        </svg>
      </div>
  </div>

  <div class="x-landing__right">
    <div class="x-dialog__content">
      {% if error %}
        <h2>Verification Failed</h2>
        <p style="margin-bottom: 20px; color: #f4212e; text-align: center;">
          {{ error }}
        </p>
        <p style="margin-bottom: 20px; color: #536471; text-align: center;">
          The verification link may be invalid or expired.
        </p>
      {% else %}
        <h2>Thank you!</h2>
        <p style="margin-bottom: 20px; color: #536471; text-align: center;">
          Your account has been verified successfully. You can now log in.
        </p>
      {% endif %}
      <div style="text-align: center;">
        <a href="{{ url_for('login') }}" class="x-dialog__btn" style="display: inline-block; text-decoration: none;">
          Go to Login
        </a>
      </div>
    </div>
  </div>
</main>

{% include "_footer.html" %}
